<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Gestión de Datos — Pymap</title>
        <link rel="stylesheet" href="css/estilo.css" />
        <link rel="icon" href="favicon.ico" type="image/x-icon" />
        <script type="module" src="js/template-include.js"></script>
        <script type="module" src="js/auth-guard.js"></script>
    </head>
    <body>
        <div class="app">
            <div id="sidebar-container"></div>

            <main class="main">
                <section class="card">
                    <div class="page-title">
                        <h1>Gestión de Datos</h1>
                        <p>
                            Administra todas las colecciones de la plataforma
                            desde un solo lugar.
                        </p>
                    </div>

                    <div
                        class="metrics"
                        style="margin-top: 16px"
                        id="metrics-container"
                    ></div>
                </section>

                <div class="content">
                    <div class="card">
                        <div
                            style="
                                display: flex;
                                justify-content: space-between;
                                align-items: center;
                                margin-bottom: 16px;
                            "
                        >
                            <h2
                                style="
                                    margin: 0;
                                    font-size: 16px;
                                    font-weight: 700;
                                    color: var(--purple);
                                "
                                id="table-title"
                            >
                                Datos
                            </h2>

                            <select
                                class="select"
                                id="collection-selector"
                                style="width: 200px"
                            >
                                <option value="users">Usuarios</option>
                                <option value="businesses">Negocios</option>
                                <option value="bookings">Reservas</option>
                                <option value="reviews">Reseñas</option>
                            </select>
                        </div>

                        <div id="data-table-container"></div>
                    </div>
                </div>
            </main>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <script type="module" src="js/data-manager.js"></script>
    </body>
</html>
