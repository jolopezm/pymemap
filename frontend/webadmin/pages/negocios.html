<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gestión de Negocios — Pymap</title>

        <!-- Tipografía -->
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../css/estilo.css" />

        <!-- Template Include -->
        <script type="module" src="../js/template-include.js"></script>

        <!-- Auth Guard -->
        <script type="module" src="../js/auth-guard.js"></script>
    </head>
    <body>
        <div class="app">
            <!-- Left Sidebar (cargado dinámicamente) -->
            <div id="sidebar-container"></div>

            <!-- Main content -->
            <main class="main">
                <!-- Page Title -->
                <section class="card">
                    <div class="page-title">
                        <h1>Gestión de Negocios</h1>
                        <p>
                            Administra todos los negocios registrados en la
                            plataforma.
                        </p>
                    </div>

                    <!-- Métricas -->
                    <div class="metrics" style="margin-top: 16px">
                        <div class="metric">
                            <div class="num" id="totalBusinesses">0</div>
                            <div class="label">Total Negocios</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="activeBusinesses">0</div>
                            <div class="label">Activos</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="verifiedBusinesses">0</div>
                            <div class="label">Verificados</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="avgRating">0.0</div>
                            <div class="label">Rating Promedio</div>
                        </div>
                    </div>
                </section>

                <!-- Lista de negocios -->
                <div class="content">
                    <div class="card">
                        <h2
                            style="
                                margin: 0 0 12px;
                                font-size: 16px;
                                font-weight: 700;
                                color: var(--purple);
                            "
                        >
                            Lista de Negocios
                        </h2>

                        <!-- Controles de filtrado -->
                        <div class="controls">
                            <select class="select" id="categoryFilter">
                                <option value="">Todas las categorías</option>
                                <option value="restaurant">Restaurante</option>
                                <option value="salon">Salón de Belleza</option>
                                <option value="gym">Gimnasio</option>
                                <option value="clinic">Clínica</option>
                                <option value="other">Otro</option>
                            </select>

                            <input
                                type="search"
                                class="input"
                                id="searchInput"
                                placeholder="Buscar por nombre..."
                            />
                        </div>

                        <!-- Tabla de negocios -->
                        <div id="businesses-table-container"></div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Toast notifications -->
        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <!-- JavaScript -->
        <script type="module" src="../js/businesses.js"></script>
    </body>
</html>
