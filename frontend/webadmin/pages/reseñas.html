<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gestión de Reseñas — Pymap</title>


        <link rel="stylesheet" href="../css/estilo.css" />
        <script type="module" src="../js/template-include.js"></script>
        <script type="module" src="../js/auth-guard.js"></script>
    </head>
    <body>
        <div class="app">
            <div id="sidebar-container"></div>

            <main class="main">
                <section class="card">
                    <div class="page-title">
                        <h1>Gestión de Reseñas</h1>
                        <p>
                            Administra todas las reseñas y calificaciones de la
                            plataforma.
                        </p>
                    </div>

                    <div class="metrics" style="margin-top: 16px">
                        <div class="metric">
                            <div class="num" id="totalReviews">0</div>
                            <div class="label">Total Reseñas</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="avgRating">0.0</div>
                            <div class="label">Rating Promedio</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="fiveStars">0</div>
                            <div class="label">5 Estrellas</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="lowRatings">0</div>
                            <div class="label">≤ 2 Estrellas</div>
                        </div>
                    </div>
                </section>

                <div class="content">
                    <div class="card">
                        <h2
                            style="
                                margin: 0 0 12px;
                                font-size: 16px;
                                font-weight: 700;
                                color: var(--purple);
                            "
                        >
                            Lista de Reseñas
                        </h2>

                        <div class="controls">
                            <select class="select" id="ratingFilter">
                                <option value="">
                                    Todas las calificaciones
                                </option>
                                <option value="5">
                                    ⭐⭐⭐⭐⭐ 5 estrellas
                                </option>
                                <option value="4">⭐⭐⭐⭐ 4 estrellas</option>
                                <option value="3">⭐⭐⭐ 3 estrellas</option>
                                <option value="2">⭐⭐ 2 estrellas</option>
                                <option value="1">⭐ 1 estrella</option>
                            </select>

                            <input
                                type="search"
                                class="input"
                                id="searchInput"
                                placeholder="Buscar por negocio o usuario..."
                            />
                        </div>

                        <!-- Tabla de reseñas -->
                        <div id="reviews-table-container"></div>  
                    </div>
                </div>
            </main>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <script type="module" src="../js/reviews.js"></script>
    </body>
</html>
