<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gestión de Reseñas — PymeMap</title>

        <!-- Tipografía -->
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../css/estilo.css" />

        <!-- Template Include -->
        <script type="module" src="../js/template-include.js"></script>

        <!-- Auth Guard -->
        <script type="module" src="../js/auth-guard.js"></script>
    </head>
    <body>
        <div class="app">
            <!-- Left Sidebar (cargado dinámicamente) -->
            <div id="sidebar-container"></div>

            <!-- Main content -->
            <main class="main">
                <!-- Page Title -->
                <section class="card">
                    <div class="page-title">
                        <h1>Gestión de Reseñas</h1>
                        <p>
                            Administra todas las reseñas y calificaciones de la
                            plataforma.
                        </p>
                    </div>

                    <!-- Métricas -->
                    <div class="metrics" style="margin-top: 16px">
                        <div class="metric">
                            <div class="num" id="totalReviews">0</div>
                            <div class="label">Total Reseñas</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="avgRating">0.0</div>
                            <div class="label">Rating Promedio</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="fiveStars">0</div>
                            <div class="label">5 Estrellas</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="lowRatings">0</div>
                            <div class="label">≤ 2 Estrellas</div>
                        </div>
                    </div>
                </section>

                <!-- Lista de reseñas -->
                <div class="content">
                    <div class="card">
                        <h2
                            style="
                                margin: 0 0 12px;
                                font-size: 16px;
                                font-weight: 700;
                                color: var(--purple);
                            "
                        >
                            Lista de Reseñas
                        </h2>

                        <!-- Controles de filtrado -->
                        <div class="controls">
                            <select class="select" id="ratingFilter">
                                <option value="">
                                    Todas las calificaciones
                                </option>
                                <option value="5">
                                    ⭐⭐⭐⭐⭐ 5 estrellas
                                </option>
                                <option value="4">⭐⭐⭐⭐ 4 estrellas</option>
                                <option value="3">⭐⭐⭐ 3 estrellas</option>
                                <option value="2">⭐⭐ 2 estrellas</option>
                                <option value="1">⭐ 1 estrella</option>
                            </select>

                            <input
                                type="search"
                                class="input"
                                id="searchInput"
                                placeholder="Buscar por negocio o usuario..."
                            />
                        </div>

                        <!-- Loading state -->
                        <div
                            id="loading"
                            style="text-align: center; padding: 40px"
                        >
                            <p>Cargando reseñas...</p>
                        </div>

                        <!-- Tabla de reseñas -->
                        <div id="reviews-table" style="display: none">
                            <table
                                style="width: 100%; border-collapse: collapse"
                            >
                                <thead>
                                    <tr
                                        style="
                                            border-bottom: 1px solid
                                                var(--light-gray);
                                        "
                                    >
                                        <th
                                            style="
                                                text-align: left;
                                                padding: 12px;
                                            "
                                        >
                                            Usuario
                                        </th>
                                        <th
                                            style="
                                                text-align: left;
                                                padding: 12px;
                                            "
                                        >
                                            Negocio
                                        </th>
                                        <th
                                            style="
                                                text-align: left;
                                                padding: 12px;
                                            "
                                        >
                                            Rating
                                        </th>
                                        <th
                                            style="
                                                text-align: left;
                                                padding: 12px;
                                            "
                                        >
                                            Comentario
                                        </th>
                                        <th
                                            style="
                                                text-align: center;
                                                padding: 12px;
                                            "
                                        >
                                            Acciones
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="reviews-list">
                                    <!-- Se llenará dinámicamente -->
                                </tbody>
                            </table>
                        </div>

                        <!-- Empty state -->
                        <div
                            id="empty-state"
                            style="
                                display: none;
                                text-align: center;
                                padding: 40px;
                            "
                        >
                            <p>No se encontraron reseñas.</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Toast notifications -->
        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <!-- JavaScript -->
        <script type="module" src="../js/reviews.js"></script>
    </body>
</html>
