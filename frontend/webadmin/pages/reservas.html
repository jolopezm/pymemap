<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gestión de Reservas — Pymap</title>
        <link rel="stylesheet" href="../css/estilo.css" />
        <script type="module" src="../js/template-include.js"></script>
        <script type="module" src="../js/auth-guard.js"></script>
    </head>
    <body>
        <div class="app">
            <!-- Left Sidebar (cargado dinámicamente) -->
            <div id="sidebar-container"></div>

            <!-- Main content -->
            <main class="main">
                <!-- Page Title -->
                <section class="card">
                    <div class="page-title">
                        <h1>Gestión de Reservas</h1>
                        <p>Administra todas las reservas de la plataforma.</p>
                    </div>

                    <!-- Métricas -->
                    <div class="metrics" style="margin-top: 16px">
                        <div class="metric">
                            <div class="num" id="totalBookings">0</div>
                            <div class="label">Total Reservas</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="pendingBookings">0</div>
                            <div class="label">Pendientes</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="confirmedBookings">0</div>
                            <div class="label">Confirmadas</div>
                        </div>
                        <div class="metric">
                            <div class="num" id="completedBookings">0</div>
                            <div class="label">Completadas</div>
                        </div>
                    </div>
                </section>

                <!-- Lista de reservas -->
                <div class="content">
                    <div class="card">
                        <h2
                            style="
                                margin: 0 0 12px;
                                font-size: 16px;
                                font-weight: 700;
                                color: var(--purple);
                            "
                        >
                            Lista de Reservas
                        </h2>

                        <!-- Tabla de reservas -->
                        <div id="bookings-table-container"></div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Toast notifications -->
        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <!-- JavaScript -->
        <script type="module" src="../js/bookings.js"></script>
    </body>
</html>
