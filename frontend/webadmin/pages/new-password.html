<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Restablecer Contraseña</title>
        <style>
            body {
                font-family: system-ui, Arial;
                padding: 24px;
                max-width: 520px;
                margin: auto;
            }
            label {
                display: block;
                margin-top: 12px;
                font-weight: 500;
            }
            input[type='password'] {
                width: 100%;
                padding: 8px;
                margin-top: 6px;
                box-sizing: border-box;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            input[type='password']:focus {
                outline: none;
                border-color: #1976d2;
            }
            button {
                margin-top: 12px;
                padding: 10px 16px;
                background-color: #1976d2;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                width: 100%;
            }
            button:hover:not(:disabled) {
                background-color: #1565c0;
            }
            button:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }
            .msg {
                margin-top: 12px;
                padding: 10px;
                border-radius: 4px;
            }
            .error {
                color: #b00020;
                background-color: #fdecea;
                border: 1px solid #f5c2c7;
            }
            .success {
                color: #155724;
                background-color: #d4edda;
                border: 1px solid #c3e6cb;
            }
            .password-requirements {
                margin-top: 16px;
                padding: 12px;
                background-color: #f5f5f5;
                border-radius: 4px;
                font-size: 13px;
            }
            .password-requirements h3 {
                margin: 0 0 8px 0;
                font-size: 14px;
                color: #333;
            }
            .requirement {
                margin: 6px 0;
                color: #666;
            }
            .requirement.valid {
                color: #155724;
            }
            .requirement.valid::before {
                content: '✓ ';
                font-weight: bold;
            }
            .requirement.invalid::before {
                content: '✗ ';
                font-weight: bold;
                color: #b00020;
            }
            .back-link {
                display: inline-block;
                margin-top: 16px;
                color: #1976d2;
                text-decoration: none;
            }
            .back-link:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <h1>Restablecer Contraseña</h1>

        <form id="password-form">
            <label for="password">Nueva contraseña</label>
            <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="new-password"
            />

            <label for="confirm-password">Confirmar contraseña</label>
            <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                required
                autocomplete="new-password"
            />

            <div class="password-requirements">
                <h3>Requisitos de la contraseña:</h3>
                <div class="requirement" data-rule="length">
                    Al menos 8 caracteres
                </div>
                <div class="requirement" data-rule="uppercase">
                    Al menos una letra mayúscula
                </div>
                <div class="requirement" data-rule="lowercase">
                    Al menos una letra minúscula
                </div>
                <div class="requirement" data-rule="number">
                    Al menos un número
                </div>
                <div class="requirement" data-rule="special">
                    Al menos un carácter especial (!@#$%^&*(),.?":{}|&lt;&gt;)
                </div>
                <div class="requirement" data-rule="match">
                    Las contraseñas deben coincidir
                </div>
            </div>

            <button id="submit-btn" type="submit" disabled>
                Restablecer Contraseña
            </button>
        </form>

        <div
            id="message"
            class="msg"
            role="status"
            aria-live="polite"
            style="display: none"
        ></div>

        <a href="send-auth-code.html" class="back-link">← Volver</a>

        <script type="module">
            import { resetPassword } from '../js/api/auth-service.js'

            const passwordForm = document.getElementById('password-form')
            const passwordInput = document.getElementById('password')
            const confirmPasswordInput =
                document.getElementById('confirm-password')
            const submitBtn = document.getElementById('submit-btn')
            const messageEl = document.getElementById('message')

            // Verificar que tenemos el email guardado
            const email = sessionStorage.getItem('resetEmail')
            if (!email) {
                setMessage(
                    'Sesión expirada. Por favor, inicia el proceso nuevamente.',
                    'error'
                )
                setTimeout(() => {
                    window.location.href = 'send-auth-code.html'
                }, 2000)
            }

            function setMessage(text, type = '') {
                messageEl.textContent = text
                messageEl.className = type ? `msg ${type}` : 'msg'
                messageEl.style.display = text ? 'block' : 'none'
            }

            // Validación de contraseña en tiempo real
            const passwordRules = {
                length: password => password.length >= 8,
                uppercase: password => /[A-Z]/.test(password),
                lowercase: password => /[a-z]/.test(password),
                number: password => /[0-9]/.test(password),
                special: password => /[!@#$%^&*(),.?":{}|<>]/.test(password),
                match: () => {
                    const pwd = passwordInput.value
                    const confirm = confirmPasswordInput.value
                    return confirm.length > 0 && pwd === confirm
                },
            }

            function validatePassword() {
                const password = passwordInput.value
                let allValid = true

                // Validar cada regla excepto match
                Object.keys(passwordRules).forEach(rule => {
                    if (rule === 'match') return

                    const element = document.querySelector(
                        `[data-rule="${rule}"]`
                    )
                    const isValid = passwordRules[rule](password)

                    element.classList.toggle('valid', isValid)
                    element.classList.toggle('invalid', !isValid)

                    if (!isValid) allValid = false
                })

                // Validar match solo si hay texto en confirmPassword
                validateMatch()

                return allValid
            }

            function validateMatch() {
                const matchElement = document.querySelector(
                    '[data-rule="match"]'
                )
                const password = passwordInput.value
                const confirmPassword = confirmPasswordInput.value

                if (confirmPassword.length === 0) {
                    matchElement.classList.remove('valid', 'invalid')
                    return false
                }

                const isMatch =
                    password === confirmPassword && password.length > 0
                matchElement.classList.toggle('valid', isMatch)
                matchElement.classList.toggle('invalid', !isMatch)

                return isMatch
            }

            function checkFormValidity() {
                const password = passwordInput.value
                const confirmPassword = confirmPasswordInput.value

                // Verificar que todos los campos estén llenos
                if (!password || !confirmPassword) {
                    submitBtn.disabled = true
                    return
                }

                // Verificar todas las reglas
                const allRulesValid = Object.keys(passwordRules).every(rule =>
                    passwordRules[rule](password)
                )

                submitBtn.disabled = !allRulesValid
            }

            // Event listeners para validación en tiempo real
            passwordInput.addEventListener('input', () => {
                validatePassword()
                checkFormValidity()
            })

            confirmPasswordInput.addEventListener('input', () => {
                validateMatch()
                checkFormValidity()
            })

            // Manejo del submit
            passwordForm.addEventListener('submit', async e => {
                e.preventDefault()
                setMessage('')

                const password = passwordInput.value.trim()
                const confirmPassword = confirmPasswordInput.value.trim()

                if (password !== confirmPassword) {
                    setMessage('Las contraseñas no coinciden.', 'error')
                    return
                }

                // Validar todas las reglas antes de enviar
                const allValid = Object.keys(passwordRules).every(rule =>
                    passwordRules[rule](password)
                )

                if (!allValid) {
                    setMessage(
                        'La contraseña no cumple con todos los requisitos.',
                        'error'
                    )
                    return
                }

                submitBtn.disabled = true
                submitBtn.textContent = 'Restableciendo...'

                try {
                    await resetPassword({
                        email: email,
                        new_password: password,
                    })

                    setMessage(
                        '¡Contraseña restablecida exitosamente!',
                        'success'
                    )

                    // Limpiar sessionStorage
                    sessionStorage.removeItem('resetEmail')

                    setTimeout(() => {
                        window.location.href = 'login.html'
                    }, 1500)
                } catch (err) {
                    console.error(err)
                    setMessage(
                        err?.message ||
                            'Error al restablecer la contraseña. Intenta nuevamente.',
                        'error'
                    )
                    submitBtn.disabled = false
                    submitBtn.textContent = 'Restablecer Contraseña'
                }
            })
        </script>
    </body>
</html>
