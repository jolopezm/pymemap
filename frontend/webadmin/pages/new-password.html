<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Enviar código de autenticación</title>
        <style>
            body {
                font-family: system-ui, Arial;
                padding: 24px;
                max-width: 520px;
                margin: auto;
            }
            label {
                display: block;
                margin-top: 12px;
            }
            input[type='email'],
            input[type='text'] {
                width: 100%;
                padding: 8px;
                margin-top: 6px;
                box-sizing: border-box;
            }
            button {
                margin-top: 12px;
                padding: 8px 12px;
            }
            #code-section {
                margin-top: 16px;
                display: none;
            }
            .msg {
                margin-top: 12px;
                color: #444;
            }
            .error {
                color: #b00020;
            }
            .success {
                color: #006600;
            }
        </style>
    </head>
    <body>
        <h1>Acceso por código</h1>

        <form id="email-form">
            <label for="email">Nueva contraseña</label>
            <input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
            />

            <label for="auth-code">Confirmar contraseña</label>
            <input
                id="auth-code"
                name="code"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
            />
            <button id="verify-btn" type="submit">Aceptar</button>
        </form>

        <div id="message" class="msg" role="status" aria-live="polite"></div>

        <script type="module">
            import {
                sendAuthCode,
                verifyAuthCode,
            } from '../js/api/auth-service.js'

            const emailForm = document.getElementById('email-form')
            const sendBtn = document.getElementById('send-btn')
            const emailInput = document.getElementById('email')

            const codeSection = document.getElementById('code-section')
            const verifyForm = document.getElementById('verify-form')
            const codeInput = document.getElementById('auth-code')
            const verifyBtn = document.getElementById('verify-btn')

            const messageEl = document.getElementById('message')

            function setMessage(text, type = '') {
                messageEl.textContent = text
                messageEl.className = type ? `msg ${type}` : 'msg'
            }

            emailForm.addEventListener('submit', async e => {
                e.preventDefault()
                setMessage('')
                sendBtn.disabled = true
                const email = emailInput.value.trim()
                if (!email) {
                    setMessage('Introduzca un correo válido.', 'error')
                    sendBtn.disabled = false
                    return
                }

                try {
                    const resp = await sendAuthCode(email)
                    codeSection.style.display = 'block'
                    codeSection.setAttribute('aria-hidden', 'false')

                    const possibleCode =
                        resp?.code ??
                        resp?.auth_code ??
                        resp?.authCode ??
                        resp?.verification_code ??
                        resp?.verificationCode
                    if (possibleCode) {
                        codeInput.value = String(possibleCode)
                        setMessage(
                            'Código enviado. Se ha autocargado el código recibido.',
                            'success'
                        )
                    } else {
                        codeInput.value = ''
                        setMessage(
                            'Código enviado. Introduzca el código recibido en su correo.',
                            'success'
                        )
                    }

                    sessionStorage.setItem('authEmail', email)
                } catch (err) {
                    console.error(err)
                    setMessage(err?.message || 'Error enviando código', 'error')
                } finally {
                    sendBtn.disabled = false
                }
            })

            verifyForm.addEventListener('submit', async e => {
                e.preventDefault()
                setMessage('')
                verifyBtn.disabled = true

                const email =
                    sessionStorage.getItem('authEmail') ||
                    emailInput.value.trim()
                const code = codeInput.value.trim()
                if (!email || !code) {
                    setMessage('Correo y código son requeridos.', 'error')
                    verifyBtn.disabled = false
                    return
                }

                try {
                    const data = await verifyAuthCode({ email, code }, false)

                    // Guardar email para la página de nueva contraseña
                    /*
                    sessionStorage.setItem('resetEmail', email)
                    */

                    setMessage('Código verificado correctamente.', 'success')
                    setTimeout(() => {
                        window.location.href = 'new-password.html'
                    }, 800)
                } catch (err) {
                    console.error(err)
                    setMessage(err?.message || 'Código inválido', 'error')
                } finally {
                    verifyBtn.disabled = false
                }
            })
        </script>
    </body>
</html>
